ell."},{"key":"RimePost","title":"The Rimeway Post","guide":"Rime","thing":"sled","intro":"The mountain post still holds the letters written on the night of the flood. Follow the lost courier's bearings before you descend to the lock.","rule":"Send the sled sliding until it meets rock or the chart edge. Cross the gold mail cache, then STOP on the white landing.","sites":["The snow shelter","The runner's cache","The leaning pine"],"testimony":["The first letter is addressed to Ina at home. Everybody expected her back before breakfast.","There are two sets of hoofprints outside the cache. A child took the pony back alone.","The last letter is Ina's own. Please put the kettle on, she wrote. I am coming by the long way."],"charts":["First Frost","Two Tracks","Sparrow Shelf","The Crosswind","Blue Hollow","The White Mile","Lost Post","The Break in the Pines","Morning Parcel"],"ending":"Rime ties the last letter in oilcloth. Down the long steps, the lock wheel starts to turn."},{"key":"Glasscut","title":"Glasscut Gallery","guide":"Jass","thing":"miner","intro":"The bell was cast from a peculiar seam of singing glass. Jass will show you the work orders the foundry tried to lose.","rule":"Move the bronze miner one square. Push the gem cart onto the white socket. It can only be pushed from behind. The rewind lever restarts this chart.","sites":["The survey stand","The lift cage","The resonance cradle"],"testimony":["The survey pegged the seam as hollow. Something inside answered each hammer stroke.","The lift book lists only one passenger that night. Tavi carried the casting order down herself.","Scratched under the cradle: one night. Jass put those words in the contract before the bronze was poured."],"charts":["First Cut","Ore Siding","Lampblack Bend","The Switchback","Blind Seam","The Weigh House","Twelve Strokes","The Counterweight","Final Delivery"],"ending":"The cart settles into its cradle. A thread of furnace light climbs through the stone."}],"works":{"roadLeaves":[{"name":"Mara \u00b7 Orchard post","shared":"A graft takes when the two cuts grow one skin. Come evening nine children cut nine lanterns from my winter quinces. You should see them waiting their turns at the bell.","freed":"Ina came for a cutting. She held the knife backward until I showed her. We planted the graft by her door. By supper she had asked me three times when it might flower."},{"name":"Jori \u00b7 Tileworks post","shared":"I made a thumb tile for each new keeper. Once their shift is done they lay it warm-side down on the sill. My daughter can tell who worked the night by touching the clay.","freed":"Tavi asked for a roof tile with no mark on it. She and Ina sat on my kiln step drawing sea birds into the wet clay with the same pin."},{"name":"Senn \u00b7 Archive post","shared":"In the index I wrote room for ten hands, although only nine households live along the road. A stranger ought to be able to sign. You did.","freed":"The day the bell let her go, Ina brought the book back herself. She crossed out the word missing. She left the space after her name quite empty."},{"name":"Tern \u00b7 Beacon post","shared":"Someone left a lamp in the cairn for whoever takes the hill after dark. Tonight it was my turn. I left dry socks for the next pair of feet.","freed":"My sister walked the high mile with Ina. Neither said much. At the last cairn they left two green stones in the dry niche, one for each return."},{"name":"Issa \u00b7 Water court","shared":"The closure is lifted in nine different hands. My seal sits at the bottom with the rest. The right of way belongs to the next person who needs it.","freed":"Today a young bellmender asked me if she needed leave to use the road. I took the old closure plate down and gave it to her for a boat anchor."}],"flags":["admitted","wetKey","reed","balanceKey","yoke","opticKey","glass","reedSet","yokeSet","glassSet","answered","petition","knot","blank","wage","token","named","charter","sounding","leading","distress","landed"],

d?"],"A_Letter":[33,"WITNESS LEAF  /  A child's drawing of a bell. There are two figures underneath. One has been rubbed away."],"A_Gate":[33,"Epilogue  /  Hear Tavi's last letter."],"A_Roster":[33,"WATCH ROSTER  /  Dusk: Tavi at the wheel. Midnight: Fen on the bridge. Dawn: Ossa at the bell. Underneath, in smaller letters: Let Ina sleep."]}},{"room":0,"seals":3,"melody":3,"water":1,"lenses":3,"strikes":3,"hearts":3,"ending":2,"commissioned":true,"challenged":true,"solved":false,"called":1,"beam":4,"objective":"Epilogue  /  Visit Tavi in the morning market.","keys":[],"moves":{"A_Talk":[34,"TAVI  /  I heard a girl laughing down by the lock. For the first time in twelve years the bell was perfectly still."],"A_Letter":[34,"WITNESS LEAF  /  A child's drawing of a bell. There are two figures underneath. One has been rubbed away."],"A_Gate":[34,"Epilogue  /  Visit Tavi in the morning market."],"A_Ina":[34,"INA  /  I used to think a river made one sound. Stand a while. There's the water against the bank, the wheel turning, a wren in the reeds. I'm going to learn them all."]}}],"rooms":["Bellmarket","RootChoir","Reedwater","CinderLens","StillBelfry"],"titles":["Bellmender's Market","The Root Choir","Reedwater Lock","The Cinder Lens","The Still Belfry"],"speakers":["Tavi","Moss","Fen","Ossa","The Quiet"]},"streamed":true,"regions":[{"key":"Saltwake","title":"Saltwake Sound","guide":"Marn","thing":"skiff","intro":"The drowned bell sent a second note out to sea. Marn kept the three pilots' logs. Read the soundings and bring each signal boat home.","rule":"Steer the skiff one square. Blue arrows carry it with the current. Touch the brass buoy, then moor at the white ring.","sites":["The tide staff","The salvage crane","The last beacon"],"testimony":["The low-water mark is above Marn's shoulder. The first signal went out before the river rose.","A coat button hangs from the crane hook. Ina sent the boat back empty so it could take another family.","Oil for twelve winters, signed for by Tavi. She never told the pilots why the beacon still burned."],"charts":["Outer Bar","Kettle Reach","The Eel Cut","Flood Ledger","Blind Anchorage","The Empty Ferry","North Lantern","The Widow's Buoy","Home Sounding"],"ending":"Marn turns the lighthouse seaward. Through the fog comes the answer of a little forest bell."},{"key":"RimePost","title":"The Rimeway Post","guide":"Rime","thing":"sled","intro":"The mountain post still holds the letters written on the night of the flood. Follow the lost courier's bearings before you descend to the lock.","rule":"Send the sled sliding until it meets rock or the chart edge. Cross the gold mail cache, then STOP on the white landing.","sites":["The snow shelter","The runner's cache","The leaning pine"],"testimony":["The first letter is addressed to Ina at home. Everybody expected her back before breakfast.","There are two sets of hoofprints outside the cache. A child took the pony back alone.","The last letter is Ina's own. Please put the kettle on, she wrote. I am coming by the long way."],"charts":["First Frost","Two Tracks","Sparrow Shelf","The Crosswind","Blue Hollow","The White Mile","Lost Post","The Break in the Pines","Morning Parcel"],"ending":"Rime ties the last letter in oilcloth. Down the long steps, the lock wheel starts to turn."},{"key":"Glasscut","title":"Glasscut Gallery","guide":"Jass","thing":"miner","intro":"The bell was cast from a peculiar seam of singing glass. Jass will show you the work orders the foundry tried to lose.","rule":"Move the bronze miner one square. Push the gem cart onto the white socket. It can only be pushed from behind. The rewind lever restarts this chart.","sites":["The survey stand","The lift cage","The resonance cradle"],"testimony":["The survey pegged the seam as hollow. Something inside answered each hammer stroke.","The lift book lists only one passenger that night. Tavi carried the casting order down herself.","Scratched under the cradle: one night. Jass put those words in the contract before the bronze was poured."],"charts":["First Cut","Ore Siding","Lampblack Bend","The Switchback","Blind Seam","The Weigh House","Twelve Strokes","The Counterweight","Final Delivery"],"ending":"The cart settles into its cradle. A thread of furnace light climbs through the stone."}],"works":{"roadLeaves":[{"name":"Mara \u00b7 Orchard post","shared":"A graft takes when the two cuts grow one skin. Come evening nine children cut nine lanterns from my winter quinces. You should see them waiting their turns at the bell.","freed":"Ina came for a cutting. She held the knife backward until I showed her. We planted the graft by her door. By supper she had asked me three times when it might flower."},{"name":"Jori \u00b7 Tileworks post","shared":"I made a thumb tile for each new keeper. Once their shift is done they lay it warm-side down on the sill. My daughter can tell who worked the night by touching the clay.","freed":"Tavi asked for a roof tile with no mark on it. She and Ina sat on my kiln step drawing sea birds into the wet clay with the same pin."},{"name":"Senn \u00b7 Archive post","shared":"In the index I wrote room for ten hands, although only nine households live along the road. A stranger ought to be able to sign. You did.","freed":"The day the bell let her go, Ina brought the book back herself. She crossed out the word missing. She left the space after her name quite empty."},{"name":"Tern \u00b7 Beacon post","shared":"Someone left a lamp in the cairn for whoever takes the hill after dark. Tonight it was my turn. I left dry socks for the next pair of feet.","freed":"My sister walked the high mile with Ina. Neither said much. At the last cairn they left two green stones in the dry niche, one for each return."},{"name":"Issa \u00b7 Water court","shared":"The closure is lifted in nine different hands. My seal sits at the bottom with the rest. The right of way belongs to the next person who needs it.","freed":"Today a young bellmender asked me if she needed leave to use the road. I took the old closure plate down and gave it to her for a boat anchor."}],"supperNotes":[{"signal":"tinVoice","title":"Nell\u2019s lunch tin","notes":"Low \u00b7 High \u00b7 Low"},{"signal":"cupVoice","title":"Ara\u2019s measuring cups","notes":"Middle \u00b7 Middle \u00b7 High"},{"signal":"clothVoice","title":"Wen\u2019s tea cloth","notes":"High \u00b7 Low \u00b7 Middle"}],"supperEndings":["Nell, Ara and Wen sign together for the first morning watch. Iona brings four bowls up to the tower.","Ina hears the pans from the harbour kitchen. \u2018I remember that one.\u2019 She takes a fourth bowl and calls for Tavi."],"flags":["admitted","wetKey","reed","balanceKey","yoke","opticKey","glass","reedSet","yokeSet","glassSet","answered","petition","knot","blank","wage","token","named","charter","sounding","leading","distress","landed","tinVoice","cupVoice","clothVoice","supperServed"],"machines":[{"key":"water","channels":["small","deep"],"controls":["rain","spring","wasteA","wasteB","east","west"],"rows":[{"values":[0,0],"moves":[1,2,0,0,0,0]},{"values":[3,0],"moves":[1,3,0,1,4,1]},{"values":[0,5],"moves":[3,2,2,0,2,5]},{"values":[3,5],"moves":[3,3,2,1,3,3]},{"values":[0,3],"moves":[6,2,4,0,4,1]},{"values":[3,2],"moves":[5,3,7,1,2,5]},{"values":[3,3],"moves":[6,3,4,1,8,6]},{"values":[0,2],"moves":[5,2,7,0,7,9]},{"values":[1,5],"moves":[3,8,2,10,8,6]},{"values":[2,0],"moves":[1,11,0,9,7,9]},{"values":[1,0],"moves":[1,8,0,10,12,10]},{"values":[2,5],"moves":[3,11,2,9,11,13]},{"values":[0,1],"moves":[14,2,12,0,12,10]},{"values":[3,4],"moves":[13,3,15,1,11,13]},{"values":[3,1],"moves":[14,3,12,1,15,14]},{"values":[0,4],"moves":[13,2,15,0,15,14]}]},{"key":"record","channels":["verse"],"controls":["roof","oar","mill","reed"],"rows":[{"values":[0],"moves":[1,0,0,0]},{"values":[1],"moves":[1,2,0,0]},{"values":[2],"moves":[1,0,3,0]},{"values":[3],"moves":[1,0,0,4]},{"values":[4],"moves":[4,4,4,4]}]},{"key":"crane","channels":["w1","w2","w4","westPan"
